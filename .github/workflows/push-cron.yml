# שעון התזכורות: כל 15 דקות קורא לשרת ההתראות של האפליקציה, שבודק אם הגיע זמן של תזכורת כלשהי ושולח אותה.
# קריאה נוספת לא שולחת שוב, כך שעיכובים או כפילויות של GitHub לא מזיקים. (GitHub מריץ תזמונים רק מהענף הראשי)
name: Push reminders
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the reminders endpoint
        env:
          APP_URL: ${{ vars.APP_URL || 'https://plantvitalistest.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -n "$CRON_SECRET" ]; then AUTH="Authorization: Bearer $CRON_SECRET"; else AUTH="X-None: 1"; fi
          curl -fsS --max-time 60 -H "$AUTH" "$APP_URL/api/push/cron"
